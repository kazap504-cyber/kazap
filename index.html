<script>
/* T-FASTPATH-01 — Redirection instantanée si une session était active
   au dernier chargement connu (PWA / réouverture d'URL). Ce raccourci
   est purement optimiste : il ne fait qu'anticiper l'affichage, sans
   jamais se substituer à la vérification Firebase réelle. Cette
   dernière reste assurée plus bas par onAuthStateChanged dans
   dashboard.html (redirection vers landing.html si la session s'avère
   en réalité invalide). Ne pas modifier le reste du fichier. */
(function () {
  try {
    if (localStorage.getItem('kazapAuthActive') === '1') {
      window.location.replace('dashboard.html');
    }
  } catch (e) {}
})();
</script>

<script>
/* ═══════════════════════════════════════════════════════════════
   ENREGISTREMENT DU SERVICE WORKER OFFLINE (sw.js)
   ─────────────────────────────────────────────────────────────
   Ce bloc ne change JAMAIS d'une mise à jour à l'autre.
   À partir de maintenant, pour changer le comportement du cache
   offline, il suffit de modifier /sw.js et de le pousser sur
   GitHub/Render : ce script détecte automatiquement la nouvelle
   version, l'active (skipWaiting + clients.claim côté sw.js) et
   recharge la page pour appliquer les changements.
   Scope "/" — distincte de la scope FCM ("/firebase-cloud-messaging-push-scope")
   pour éviter tout conflit entre les deux service workers.
   ═══════════════════════════════════════════════════════════════ */
// --- KAZAP logger production (Guide 1 — Nettoyage console.log) ---
const KAZAP_DEBUG = false; // laisser à false en production
const logger = {
  log:   (...args) => { if (KAZAP_DEBUG) console.log(...args); },
  info:  (...args) => { if (KAZAP_DEBUG) console.info(...args); },
  warn:  (...args) => { if (KAZAP_DEBUG) console.warn(...args); },
  error: (...args) => console.error(...args), // erreurs réelles : toujours actives
};

(function () {
  if (!("serviceWorker" in navigator)) return;

  let refreshing = false;

  window.addEventListener("load", async () => {
    try {
      const reg = await navigator.serviceWorker.register("/sw.js", { scope: "/" });
      logger.log("SW offline (sw.js) enregistré :", reg);

      // Vérifie immédiatement s'il existe une version plus récente sur le serveur
      reg.update();

      // Revérifie chaque fois que l'app repasse au premier plan
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") reg.update();
      });
    } catch (err) {
      logger.warn("Erreur enregistrement sw.js :", err.message);
    }
  });

  // Dès que le nouveau SW prend le contrôle (grâce à skipWaiting + clients.claim
  // déjà présents dans sw.js), on recharge une seule fois pour appliquer les changements.
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (refreshing) return;
    refreshing = true;
    window.location.reload();
  });
})();
</script>

<!-- Le CDN Chart.js et le CDN FedaPay Checkout.js (dashboard uniquement) ne sont pas repris ici :
     ces dépendances ne servent qu au dashboard (graphiques KPI/analytics et paiement d abonnement)
     et ne doivent pas être chargées inutilement sur l écran de chargement. -->

<!-- Firebase — initialisation minimale nécessaire à onAuthStateChanged().
     Contrairement à index.html/dashboard.html, ce fichier n'importe volontairement
     ni Firestore ni Messaging (FCM) : le loader ne fait que vérifier l'état de
     connexion pour rediriger, il ne lit/écrit aucune donnée métier. -->
<script type="module">
 import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
 import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

 // VOTRE CONFIG ICI — identique à index.html/dashboard.html
 const firebaseConfig = {
 apiKey: "AIzaSyCyk_4gju7qsbHPdx5Jp4kD-D3AIslGAQ8",
 authDomain: "kazap-f8ff6.firebaseapp.com",
 projectId: "kazap-f8ff6",
 messagingSenderId: "160428099617",
 appId: "1:160428099617:web:852f982bbcf179b3513b60"
 };
 // 

 const app = initializeApp(firebaseConfig);
 const auth = getAuth(app);

 // 
 // TRANSITION — vérifie l'état de connexion puis redirige
 // 
 // Reprend la temporisation déjà présente côté index.html (filet de sécurité
 // 4s si Firebase ne répond pas, puis fondu de 400ms avant bascule) afin de
 // ne pas modifier le ressenti utilisateur actuel.
 let _loaderTimeout = null;

 function _hideLoaderThenGo(target) {
 const loader = document.getElementById("app-loader");
 if (typeof window._kazapUnlockLoaderScroll === "function") window._kazapUnlockLoaderScroll();
 if (loader) {
 loader.style.opacity = "0";
 setTimeout(() => { window.location.replace(target); }, 400);
 } else {
 window.location.replace(target);
 }
 }

 function initAuthListener() {
 onAuthStateChanged(auth, (user) => {
 // Firebase a répondu — annuler le timeout de sécurité
 if (_loaderTimeout) clearTimeout(_loaderTimeout);
 _hideLoaderThenGo(user ? "dashboard.html" : "landing.html");
 });
 }

 // ── Fallback de sécurité ──────────────────────────────────
 // Si Firebase ne répond pas dans les 4 secondes (réseau lent,
 // indisponible, ou bloqué), on part quand même vers landing.html
 // (comportement équivalent à l'ancien affichage par défaut de la
 // landing sous le loader tant que le dashboard n'était pas encore affiché).
 function startLoaderFallback() {
 _loaderTimeout = setTimeout(() => {
 _hideLoaderThenGo("landing.html");
 }, 4000);
 }

 if (document.readyState === "loading") {
 document.addEventListener("DOMContentLoaded", () => {
 initAuthListener();
 startLoaderFallback();
 });
 } else {
 initAuthListener();
 startLoaderFallback();
 }
</script>

 /* ═══════════════════════════════════════════════════════════
    LABEL FLOTTANT (floating label) — même comportement que
    l'animation "Input hover Animation" : le label est centré
    dans le champ au repos, puis remonte au-dessus de la
    bordure dès que le champ est actif ou rempli.
    Structure attendue : un conteneur ".floating" (ou toute
    classe de conteneur suffixée ".floating", ex. "form-group
    floating") contenant D'ABORD le champ (input/textarea),
    PUIS son label — l'ordre est important pour le sélecteur ~.
    ═══════════════════════════════════════════════════════════ */
 .floating { position: relative; }
 .floating > label,
 .floating > .form-label,
 .floating > .aboPay2b-label {
 position: absolute;
 left: 16px;
 top: 50%;
 transform: translateY(-50%);
 margin: 0;
 font-size: 0.95rem;
 font-weight: 400;
 color: var(--ink-light);
 background: var(--white);
 padding: 0 5px;
 pointer-events: none;
 transition: top 0.18s ease, transform 0.18s ease, font-size 0.18s ease, color 0.18s ease, font-weight 0.18s ease;
 z-index: 1;
 max-width: calc(100% - 32px);
 overflow: hidden;
 text-overflow: ellipsis;
 white-space: nowrap;
 }
 .floating > input:focus ~ label,
 .floating > textarea:focus ~ label,
 .floating > input:not(:placeholder-shown) ~ label,
 .floating > textarea:not(:placeholder-shown) ~ label {
 top: 0;
 transform: translateY(-50%);
 font-size: 0.74rem;
 font-weight: 600;
 color: var(--violet);
 }
 /* Le vrai placeholder ne s'affiche qu'au focus, pour ne pas se
    superposer visuellement au label centré au repos. */
 .floating input::placeholder,
 .floating textarea::placeholder { color: transparent; transition: color 0.15s ease; }
 .floating input:focus::placeholder,
 .floating textarea:focus::placeholder { color: var(--ink-light); }
 /* ═══════════════════════════════════════════════════════════
    BOUTON "VOIR / MASQUER" pour les champs mot de passe.
    Placé en sibling entre l'input et le label flottant : ne casse
    pas le sélecteur "~" utilisé par le label (general sibling).
    ═══════════════════════════════════════════════════════════ */
 .floating > input.form-input[data-pwd-field] { padding-right: 46px; }
 .pwd-toggle-btn {
 position: absolute;
 right: 12px;
 top: 50%;
 transform: translateY(-50%);
 width: 28px;
 height: 28px;
 display: flex;
 align-items: center;
 justify-content: center;
 background: none;
 border: none;
 padding: 0;
 margin: 0;
 cursor: pointer;
 color: var(--ink-light);
 z-index: 2;
 }
 .pwd-toggle-btn:hover { color: var(--ink); }
 .pwd-toggle-btn .pwd-icon-off { display: none; }
 .pwd-toggle-btn.revealed .pwd-icon-on { display: none; }
 .pwd-toggle-btn.revealed .pwd-icon-off { display: block; }
 .form-divider { display: flex; align-items: center; gap: 12px; font-size: 0.8rem; color: var(--ink-light); margin: 20px 0; }
 .form-divider::before, .form-divider::after { content:''; flex:1; height:1px; background:var(--border); }
 .form-switch { text-align: center; font-size: 0.85rem; color: var(--ink-light); margin-top: 20px; }
 .form-switch a { color: var(--violet); font-weight: 600; cursor: pointer; text-decoration: none; }
 .form-switch a:hover { text-decoration: underline; }
 .otp-row { display: flex; gap: 10px; justify-content: center; margin: 16px 0; }
 .otp-digit { width: 52px; height: 60px; border: 2px solid var(--border); border-radius: var(--r); text-align: center; font-family: var(--font-head); font-size: 1.5rem; font-weight: 700; color: var(--violet); background: var(--white); outline: none; transition: all 0.2s; }
 .otp-digit:focus { border-color: var(--violet); box-shadow: 0 0 0 3px rgba(4,44,83,0.12); }

 .login-tabs { display: flex; gap: 4px; background: var(--border); border-radius: var(--r); padding: 4px; margin-bottom: 24px; }

 /* KPI */

 /* KPI top accent bars */

 /* Orders / Table */

 .chart-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
 .chart-title { font-family: var(--font-head); font-size: 1.05rem; font-weight: 700; color: var(--ink); }

 /* Products */

 }

 .prod-body { padding: 14px; }

 .prod-stock { font-size: 0.82rem; line-height: 1.4; color: var(--ink-light); margin-bottom: 12px; }

 /* Shop profile */

 .shop-avatar-big img { width: 100%; height: 100%; object-fit: cover; }
 .shop-name { font-family: var(--font-head); font-size: 1.35rem; font-weight: 800; letter-spacing: -0.01em; color: var(--ink); margin-bottom: 4px; }
 .shop-cat { font-size: 0.9rem; line-height: 1.5; color: var(--ink-light); margin-bottom: 8px; }
 .shop-link-row { display: flex; align-items: center; gap: 10px; background: var(--violet-soft); border-radius: 10px; padding: 10px 14px; flex-wrap: wrap; }
 .shop-link-url { font-size: 0.82rem; color: var(--violet); font-weight: 600; font-family: monospace; text-decoration: none; flex: 1 1 160px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .shop-link-url:hover { text-decoration: underline; }
 .shop-link-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
 .shop-link-copy { background: var(--violet); color: white; border: none; border-radius: 8px; padding: 5px 12px; font-size: 0.78rem; font-weight: 600; cursor: pointer; }
 .shop-link-copy:hover { background: var(--violet-light); }

 /* Form overlay */
 .form-overlay { display: none; position: fixed; inset: 0; background: rgba(27,10,46,0.65); backdrop-filter: blur(8px); z-index: 300; align-items: center; justify-content: center; padding: 24px; }

 .form-panel { background: var(--cream); border-radius: var(--r-lg); padding: 36px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; overscroll-behavior: contain; animation: modalIn 0.28s cubic-bezier(0.34,1.4,0.64,1); }
 .form-panel-title { font-family: var(--font-head); font-size: 1.3rem; font-weight: 800; color: var(--ink); margin-bottom: 24px; }

 /* Fenetres produits en plein ecran (details produit, formulaire produit) */
 .form-overlay.form-overlay--product-fullscreen { padding: 0; background: var(--cream); align-items: stretch; justify-content: center; height: 100vh; height: 100dvh; }
 .form-panel.form-panel--product-fullscreen { box-sizing: border-box; width: 100%; max-width: 720px; height: 100vh; height: 100dvh; max-height: 100vh; max-height: 100dvh; margin: 0 auto; border-radius: 0; padding: 28px 20px 40px; box-shadow: none; }
 @media (min-width: 720px) {
 .form-panel.form-panel--product-fullscreen { padding: 48px 56px 56px; }
 }

 /* Autres fenetres modales en plein ecran (rendez-vous et fenetres similaires
    utilisant le motif form-overlay / form-panel, hors fenetres produit ci-dessus) */
 .form-overlay.form-overlay--fullscreen { padding: 0; background: var(--cream); align-items: stretch; justify-content: center; height: 100vh; height: 100dvh; }
 .form-panel.form-panel--fullscreen { box-sizing: border-box; width: 100%; max-width: 640px; height: 100vh; height: 100dvh; max-height: 100vh; max-height: 100dvh; margin: 0 auto; border-radius: 0; padding: 28px 20px 40px; box-shadow: none; }
 @media (min-width: 720px) {
 .form-panel.form-panel--fullscreen { padding: 48px 56px 56px; }
 }
 .upload-area { border: 2px dashed var(--border); border-radius: var(--r); padding: 32px; text-align: center; cursor: pointer; transition: all 0.2s; margin-bottom: 16px; font-size: 0.875rem; color: var(--ink-light); }
 .upload-area:hover { border-color: var(--violet); background: var(--violet-soft); }
 .upload-area .up-icon { font-size: 2rem; margin-bottom: 8px; }

 /* Agenda */
 .rdv-list { display: flex; flex-direction: column; gap: 10px; }
 .rdv-card { background: var(--white); border-radius: 14px; padding: 16px 20px; border: 1.5px solid var(--border); display: flex; align-items: center; gap: 16px; transition: all 0.2s; }
 .rdv-card:hover { border-color: var(--violet); box-shadow: var(--shadow); }
 .rdv-card.ia { border-left: 4px solid var(--orange); }
 .rdv-time { font-family: var(--font-head); font-size: 0.95rem; font-weight: 800; color: var(--violet); min-width: 50px; }
 .rdv-info { flex: 1; }
 .rdv-client { font-weight: 600; font-size: 0.875rem; color: var(--ink); }
 .rdv-motif { font-size: 0.78rem; color: var(--ink-light); }
 .rdv-badge { font-size: 0.72rem; font-weight: 700; padding: 4px 10px; border-radius: 99px; }
 .rdv-badge.confirmed { background: #D1FAE5; color: #065F46; }
 .rdv-badge.pending { background: var(--violet-soft); color: var(--violet); }
 .rdv-badge-ia { display:inline-block; font-size:0.68rem; font-weight:700; padding:2px 7px; border-radius:99px; background:var(--violet); color:#fff; margin-left:6px; vertical-align:middle; }

 /* IA */
 .ia-chat { background: white; border-radius: 16px; border: 1.5px solid var(--border); display: flex; flex-direction: column; height: 420px; overflow: hidden; }
 .ia-chat-head { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
 .ia-avatar { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg,var(--violet),var(--orange)); display: flex; align-items: center; justify-content: center; font-size: 1rem; }
 .ia-status { width: 8px; height: 8px; background: var(--success); border-radius: 50%; }
 .ia-msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
 .ia-msg { display: flex; gap: 10px; max-width: 85%; }
 .ia-msg.user { margin-left: auto; flex-direction: row-reverse; }
 .ia-msg-bubble { background: var(--violet-soft); border-radius: 14px 14px 14px 4px; padding: 10px 14px; font-size: 0.85rem; color: var(--ink); line-height: 1.5; }
 .ia-msg.user .ia-msg-bubble { background: var(--violet); color: white; border-radius: 14px 14px 4px 14px; }
 .ia-chat-input { border-top: 1px solid var(--border); padding: 12px 16px; display: flex; gap: 10px; }
 .ia-chat-input input { flex: 1; border: 1.5px solid var(--border); border-radius: 99px; padding: 10px 18px; font-family: var(--font-body); font-size: 0.875rem; outline: none; transition: border-color 0.2s; }
 .ia-chat-input input:focus { border-color: var(--violet); }
 .ia-send-btn { width: 40px; height: 40px; background: var(--violet); border: none; border-radius: 50%; color: white; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
 .ia-send-btn:hover { background: var(--violet-light); }

 /* Orders table */
 .cmd-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
 .cmd-filters { display: flex; gap: 6px; flex-wrap: wrap; }
 .cmd-filter-btn { padding: 7px 14px; border-radius: 99px; border: 1.5px solid var(--border); background: var(--white); color: var(--ink-mid); font-size: 0.82rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
 .cmd-filter-btn:hover { border-color: var(--violet); color: var(--violet); background: var(--violet-soft); }
 .cmd-filter-btn.active { background: var(--violet); border-color: var(--violet); color: white; }
 .cmd-table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
 .cmd-table thead th { background: var(--violet-soft); color: var(--violet); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 10px 14px; text-align: left; }
 .cmd-table td { padding: 14px; border-bottom: 1px solid var(--border); color: var(--ink-mid); vertical-align: middle; }
 .cmd-table tr:hover td { background: var(--row-hover); }
 .cmd-status { display: inline-flex; align-items: center; gap: 5px; font-size: 0.72rem; font-weight: 700; padding: 4px 10px; border-radius: 99px; }
 /* Liste des commandes : seule la cellule ID est visible (pas d'accordéon,
    pas de dépli en ligne). Un clic sur l'ID ouvre la vue détail séparée
    (#order-detail-view) via kazapShowOrderDetail(). Scopé à #orders-tbody
    pour ne jamais affecter le tableau Factures, qui partage la même classe
    .cmd-table. */
 #orders-tbody tr td:not(:first-child) { display: none; }
 #ds-commandes .cmd-orders-table thead th:not(:first-child) { display: none; }
 #orders-tbody tr .cmd-order-id-cell { cursor: pointer; display: flex; align-items: center; gap: 6px; }
 #orders-tbody tr .cmd-order-chevron { display: inline-block; font-size: 0.7rem; color: var(--ink-light); }
 /* Vue détail d'une commande (page séparée, avec bouton retour) */
 #order-detail-view { background: var(--white); border-radius: 16px; border: 1.5px solid var(--border); padding: 22px; }
 #order-detail-view .order-detail-back { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 18px; }
 /* Liste des factures : seule la cellule Numéro (avec la date) est visible
    (pas d'accordéon, pas de dépli en ligne). Un clic dessus ouvre la vue
    détail séparée (#invoice-detail-view) via kazapShowInvoiceDetail().
    Scopé à #invoices-tbody pour ne jamais affecter le tableau Commandes,
    qui partage la même classe .cmd-table. */
 #invoices-tbody tr td:not(:first-child) { display: none; }
 #ds-factures .cmd-invoices-table thead th:not(:first-child) { display: none; }
 #invoices-tbody tr .cmd-invoice-id-cell { cursor: pointer; display: flex; align-items: center; gap: 6px; }
 #invoices-tbody tr .cmd-invoice-chevron { display: inline-block; font-size: 0.7rem; color: var(--ink-light); }
 /* Vue détail d'une facture (page séparée, avec bouton retour) */
 #invoice-detail-view { background: var(--white); border-radius: 16px; border: 1.5px solid var(--border); padding: 22px; }
 #invoice-detail-view .invoice-detail-back { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 18px; }

 /* Params */
 .param-section { background: var(--white); border-radius: 16px; border: 1.5px solid var(--border); padding: 24px; margin-bottom: 16px; }
 .param-section-title { font-family: var(--font-head); font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em; color: var(--ink); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
 .param-lang-row { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: transparent; border: 1.5px solid var(--border); border-radius: 12px; padding: 14px 16px; font-family: var(--font-body); font-size: 0.9rem; font-weight: 600; color: var(--ink); cursor: pointer; transition: all 0.2s; }
 .param-lang-row:hover { background: var(--violet-soft); border-color: var(--violet); }
 .param-lang-row-right { display: flex; align-items: center; gap: 6px; color: var(--ink-light); font-weight: 500; }
 .param-lang-row:hover .param-lang-row-right { color: var(--violet); }

 /* IA config */
 .ia-tabs { display: flex; gap: 4px; background: var(--border); border-radius: 12px; padding: 4px; margin-bottom: 20px; flex-wrap: wrap; }
 .ia-tab { flex: 1; padding: 10px 16px; border-radius: 9px; border: none; background: transparent; font-family: var(--font-body); font-size: 0.85rem; font-weight: 600; color: var(--ink-mid); cursor: pointer; transition: all 0.2s; white-space: nowrap; }
 .ia-tab.active { background: var(--white); color: var(--violet); box-shadow: 0 2px 10px rgba(4,44,83,0.12); }
 .faq-item { padding: 14px 16px; border-radius: 12px; border: 1.5px solid var(--border); margin-bottom: 10px; background: var(--white); transition: all 0.2s; }
 .faq-item:hover { border-color: var(--violet); }
 .faq-q { font-weight: 700; font-size: 0.875rem; color: var(--ink); margin-bottom: 4px; }
 .faq-r { font-size: 0.82rem; color: var(--ink-mid); line-height: 1.5; }
 .faq-del-btn { background: #FEE2E2; color: #DC2626; border: none; border-radius: 8px; padding: 4px 10px; font-size: 0.75rem; font-weight: 600; cursor: pointer; margin-top: 8px; }
 .faq-del-btn:hover { background: #DC2626; color: white; }



 /* Toggle */
 .tog-wrap { position: relative; display: inline-block; width: 46px; height: 26px; cursor: pointer; }
 .tog-wrap input { opacity: 0; width: 0; height: 0; }
 .tog-slider { position: absolute; inset: 0; background: var(--border); border-radius: 26px; transition: background 0.2s; }
 .tog-slider::before { content:''; position:absolute; width:20px;height:20px;left:3px;bottom:3px; background:white;border-radius:50%;transition:transform 0.2s;box-shadow:0 1px 4px rgba(0,0,0,0.2); }
 .tog-wrap input:checked + .tog-slider { background: var(--success); }
 .tog-wrap input:checked + .tog-slider::before { transform: translateX(20px); }

 /* Lang Premium Switch — sélecteur de langue : une ligne par langue, chacune avec son switch ON/OFF */
 .lang-premium-row {
   display: flex; align-items: center; justify-content: space-between;
   gap: 16px; padding: 14px 4px;
 }
 .lang-premium-row + .lang-premium-row { border-top: 1px solid var(--border); }
 .lang-premium-row-label {
   font-family: var(--font-head); font-size: 1rem; font-weight: 700; color: var(--ink);
 }
 .lang-premium-switch { position: relative; display: inline-flex; align-items: center; width: 46px; height: 26px; cursor: pointer; user-select: none; flex-shrink: 0; }
 .lang-premium-switch input { opacity: 0; width: 0; height: 0; position: absolute; }
 .lang-premium-track {
   position: absolute; inset: 0;
   border-radius: 60px;
   background: linear-gradient(135deg, #374151, #4B5563);
   box-shadow: 0 10px 25px rgba(0,0,0,0.15), inset 0 2px 8px rgba(255,255,255,0.08);
   transition: background 0.25s ease;
   display: flex; align-items: center;
 }
 .lang-premium-switch input:checked + .lang-premium-track {
   background: linear-gradient(135deg, var(--violet), var(--success));
   box-shadow: 0 10px 25px rgba(16,185,129,0.25), inset 0 2px 8px rgba(255,255,255,0.15);
 }
 .lang-premium-label {
   position: absolute; top: 0; bottom: 0;
   display: flex; align-items: center;
   font-family: var(--font-head);
   font-size: 0.4rem; font-weight: 800; letter-spacing: 0.01em;
   color: white; transition: opacity 0.2s ease;
 }
 .lang-premium-label-on { left: 5px; opacity: 0; }
 .lang-premium-label-off { right: 5px; opacity: 1; }
 .lang-premium-switch input:checked ~ .lang-premium-label-on { opacity: 1; }
 .lang-premium-switch input:checked ~ .lang-premium-label-off { opacity: 0; }
 .lang-premium-thumb {
   position: absolute; top: 3px; left: 3px;
   width: 20px; height: 20px;
   background: white;
   border-radius: 50%;
   box-shadow: 0 2px 8px rgba(0,0,0,0.25);
   display: flex; align-items: center; justify-content: center;
   font-family: var(--font-head); font-size: 0.4rem; font-weight: 800;
   color: var(--ink);
   transition: transform 0.25s ease;
   z-index: 2;
 }
 .lang-premium-switch input:checked ~ .lang-premium-thumb {
   transform: translateX(20px);
 }

 /* Calendar */
 .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; margin-top: 12px; }
 .cal-head { text-align: center; font-size: 0.7rem; font-weight: 700; color: var(--ink-light); text-transform: uppercase; padding: 6px 0; }
 .cal-cell { min-height: 40px; border-radius: 8px; padding: 6px; cursor: pointer; transition: all 0.15s; background: var(--white); border: 1px solid var(--border); text-align: center; font-size: 0.82rem; }
 .cal-cell:hover { border-color: var(--violet); background: var(--violet-soft); }

 nav { display: none; }

 }
 /* MOBILE BOTTOM NAV — masquée par défaut */
 .mob-bottom-nav { display: none; }

 @media (max-width: 900px) {
 /* Sur mobile : sidebar fixe, cachée par défaut */
 .dash-sidebar {
   position: fixed;
   top: 0; left: 0;
   z-index: 1050;
   width: 220px !important;
   height: 100vh;
   transform: translateX(-100%);
   transition: transform 0.3s ease;
   overflow: hidden;
 }
 .dash-sidebar.mob-open {
   transform: translateX(0);
 }
 /* Overlay sombre derrière la sidebar */
 .sidebar-overlay {
   display: none;
   position: fixed;
   inset: 0;
   z-index: 1040;
   background: rgba(0,0,0,0.45);
 }
 .sidebar-overlay.active { display: block; }
 /* Layout dashboard : sidebar ne prend plus de place fixe */
 /* NB: pas de "display:flex" forcé ici — l'affichage du dashboard reste
    piloté par le JS (showDashboard / connexion). Sans cette correction,
    le dashboard s'affichait sur mobile même sans être connecté. */
 .dash-main { width: 100%; }
 /* Sidebar intérieure en mode mob-open : user info visible */
 .dash-sidebar.mob-open .dash-user-top { flex-direction: row; align-items: center; gap: 12px; padding: 12px 16px 16px; }
 .dash-sidebar.mob-open .dash-user-info { display: block; }
 .dash-sidebar.mob-open .dash-avatar-lg { width: 38px; height: 38px; font-size: 0.95rem; }
 .dash-sidebar.mob-open .snav-section { font-size: 0.66rem; margin: 20px 0 8px; padding: 0 14px; text-align: left; }
 .dash-sidebar.mob-open .snav-item { padding: 12px 14px; gap: 14px; flex-direction: row; align-items: center; justify-content: flex-start; }
 .dash-sidebar.mob-open .snav-item > span:not(.snav-icon-wrap):not(.sbadge) { font-size: 0.9rem; text-align: left; }
 .dash-sidebar.mob-open .snav-icon-wrap { width: 22px; height: 22px; }
 .dash-sidebar.mob-open .snav-icon-wrap svg { width: 20px; height: 20px; }
 .dash-sidebar.mob-open .snav-logout { font-size: 0.8rem; padding: 10px 12px; display: flex; justify-content: flex-start; gap: 8px; }
 .kpi-grid { grid-template-columns: repeat(2, 1fr); }
 .shop-profile-card { flex-direction: column; min-width: 0; }
 /* Bloc lien boutique (Copier) : empilé, largeur forcée pour ne jamais déborder l'écran.
    NB (correctif débordement) : par défaut, les enfants flex ont min-width:auto, ce qui
    empêche un texte non-coupé (l'URL en white-space:nowrap) de se réduire — il pousse alors
    toute la chaîne de parents flex à s'élargir au-delà de l'écran, même avec width:100%
    et overflow:hidden sur .shop-link-url. On force min-width:0 sur toute la chaîne pour que
    ces conteneurs acceptent enfin de se réduire à la largeur de l'écran ; l'ellipsis peut
    alors s'appliquer normalement. */
 .shop-profile-card > * { min-width: 0; }
 .shop-link-row { flex-wrap: nowrap; flex-direction: column; align-items: stretch; gap: 10px; padding: 12px; width: 100%; max-width: 100%; min-width: 0; box-sizing: border-box; }
 .shop-link-row > * { min-width: 0; }
 .shop-link-url { flex: none; width: 100%; max-width: 100%; min-width: 0; font-size: 0.78rem; }
 .shop-link-actions { width: 100%; gap: 8px; min-width: 0; justify-content: center; }

 .shop-link-actions .shop-link-copy svg { width: 11px; height: 11px; flex-shrink: 0; }
 .dash-content { padding: 16px 14px; overflow-x: hidden; }
 }

/* ═══════════════════════════════════════════════════════════
   ÉTAPE 2 — OPTIMISATION MOBILE : Formulaires & Inputs
   Portée : styles formulaires uniquement — zero régression desktop
   ═══════════════════════════════════════════════════════════ */

@media (max-width: 768px) {

  /* ── FIX 1 : font-size ≥ 16px → empêche le zoom automatique iOS ── */
  .form-input,
  .otp-digit,
  select.form-input,
  textarea.form-input {
    font-size: 16px !important; /* valeur absolue = garantie iOS Safari */
  }

  /* ── FIX 2 : Labels flottants ──
     Le style est désormais défini une seule fois, de façon globale
     (voir règles ".floating" juste après .form-hint), pour un
     comportement identique mobile/desktop.
  ── */

  /* ── FIX 3 : Bouton submit visible malgré le clavier virtuel ──
     Les boutons .btn-full dans les overlays/modaux restent collés en bas.
  ── */
  .overlay-body .btn-full,
  .modal-body .btn-full,
  #product-form-overlay .btn-full,
  #rdv-form-overlay .btn-full {
    position: sticky;
    bottom: 0;
    z-index: 10;
    /* Ombre douce pour signaler qu'il "flotte" */
    box-shadow: 0 -4px 16px rgba(0,0,0,0.12);
    /* Petite marge pour ne pas coller au bord */
    margin-top: 8px;
  }

  /* ── FIX 4 : Sélecteur date/time natif iOS — pas de JS override ──
     On s'assure que l'apparence native est préservée sur iOS Safari.
  ── */
  input[type="date"].form-input,
  input[type="time"].form-input {
    -webkit-appearance: none; /* retire le style webkit qui peut casser le picker */
    appearance: none;
    min-height: 48px; /* zone de tap confortable */
  }

} /* fin @media mobile */

/* ══════════════════════════════════════════════════════════════
   PARTIE 2 — Boutons · Formulaires · Zones cliquables (mobile)
   Objectif : tap targets ≥ 44×44 px, inputs confortables,
   boutons principaux full-width, espacement ≥ 8 px, feedback tactile
   ══════════════════════════════════════════════════════════════ */

/* ── P2-1 : Feedback tactile global (supprime le flash bleu iOS) ── */
* { -webkit-tap-highlight-color: rgba(4,44,83,0.15); }
button, a, [role="button"], label[onclick], .tog-wrap {
  -webkit-tap-highlight-color: rgba(4,44,83,0.15);
}

/* ── P2-2 : Garantie cursor:pointer sur tout élément cliquable ── */
button:not([disabled]),
a,
[role="button"],
label[onclick],
.tog-wrap,
.cal-cell,
.voip-provider-card,
.snav-item,
.upload-area,
.shop-link-copy,
.cmd-filter-btn,
.ftab,
.ltab,
.ia-tab,
.topbar-btn,
.topbar-avatar-btn,
.topbar-darkmode-btn,
.ham-btn,
.hamburger,
.modal-close,
.faq-del-btn,
.ia-send-btn {
  cursor: pointer;
}

/* ── P2-3 : Zone de tap minimale 44×44 px pour les petits boutons ── */
.modal-close {
  width: 44px;
  height: 44px;
}
.topbar-btn,
.topbar-avatar-btn,
.topbar-darkmode-btn {
  min-width: 44px;
  min-height: 44px;
}
.ia-send-btn {
  width: 44px;
  height: 44px;
}
.shop-link-copy {
  min-height: 44px;
  padding: 8px 14px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.faq-del-btn {
  min-height: 36px; /* secondary action, moins critique */
  padding: 6px 12px;
}
.cal-cell {
  min-height: 44px;
}
.lang-switch-btn {
  min-height: 36px;
  padding: 6px 10px !important;
}

/* ── P2-4 : Boutons génériques — min-height 44 px ── */
.btn {
  min-height: 44px;
}
.btn-sm {
  min-height: 40px;
}
.ftab,
.ltab,
.ia-tab {
  min-height: 44px;
}
.cmd-filter-btn {
  min-height: 40px;
  padding: 10px 16px;
}
.snav-logout {
  min-height: 44px;
}

/* ── P2-5 : Inputs / selects / textareas — padding vertical ≥ 12 px ── */
.form-input {
  padding-top: 13px !important;
  padding-bottom: 13px !important;
  min-height: 48px;
}
textarea.form-input {
  min-height: unset; /* ne pas forcer la hauteur sur les textarea */
}

/* ── P2-6 : Espacement minimum 8 px entre éléments interactifs adjacents ── */
.btn + .btn,
.cmd-filter-btn + .cmd-filter-btn,
.ftab + .ftab,
.ltab + .ltab,
.ia-tab + .ia-tab,
.shop-link-copy + .shop-link-copy,
.lang-switch-btn + .lang-switch-btn {
  margin-left: 8px;
}

/* ── P2-7 : Boutons d'action principaux → width:100% sur mobile ── */
@media (max-width: 768px) {
  /* Boutons CTA hero */
  .hero-actions .btn,
  /* Boutons dans les modaux/overlays */
  .modal-body .btn-primary,
  .modal-body .btn-orange,
  .overlay-body .btn-primary,
  .overlay-body .btn-orange,
  /* Boutons de sauvegarde dans les sections dashboard */
  #section-ia .btn-primary,
  #section-settings .btn-primary,
  #section-settings .btn-orange,
  /* Bouton connexion / inscription */
  #login-form .btn,
  #signup-step1 .btn,
  #signup-step2 .btn,
  #otp-form .btn {
    width: 100%;
    display: flex;
    justify-content: center;
  }

  /* Boutons d'action dashboard (nouveau produit, nouveau RDV) */
  .btn.btn-orange.btn-sm[onclick*="openProductForm"],
  .btn.btn-orange.btn-sm[onclick*="openRDVForm"] {
    min-width: 160px;
  }

  /* Espacement vertical entre boutons empilés */
  .modal-body .btn + .btn,
  .overlay-body .btn + .btn {
    margin-left: 0;
    margin-top: 8px;
  }

  /* Formulaire recherche commandes — full width sur mobile */
  .form-input[oninput*="searchOrders"] {
    max-width: 100% !important;
    width: 100%;
  }

  /* Boutons du calendrier (mois précédent/suivant) */
  button[onclick="prevMonth()"],
  button[onclick="nextMonth()"] {
    min-width: 44px;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  /* Hamburger menu — zone de tap suffisante */
  .hamburger {
    padding: 10px;
    min-height: 44px;
    min-width: 44px;
    align-items: center;
    justify-content: center;
  }

  /* Ham-btn sidebar mobile */
  .ham-btn {
    min-height: 44px;
    min-width: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Focus visible pour accessibilité tactile */
  button:focus-visible,
  a:focus-visible,
  .btn:focus-visible {
    outline: 2px solid var(--violet);
    outline-offset: 2px;
  }
}
/* fin Partie 2 */

/* ══════════════════════════════════════════════════════════════
   PARTIE 3B-2a — Grilles responsives & Overflow horizontal (mobile)
   Objectif : toutes les grilles CSS passent en colonne unique sur
   mobile (≤767px) ; suppression du scroll horizontal indésirable.
   Ne touche ni aux tables, ni au JS métier, ni au menu hamburger.
   ══════════════════════════════════════════════════════════════ */

@media (max-width: 767px) {

  /* ── Sécurité supplémentaire anti-débordement horizontal ── */
  html, body {
    max-width: 100%;
    overflow-x: hidden;
  }

  /* ── Grilles principales du site marketing ── */
  .hero {
    grid-template-columns: 1fr;
    gap: 32px;
    padding-left: 16px;
    padding-right: 16px;
  }
  .problems-grid {
    grid-template-columns: 1fr;
  }
  .feature-panel.active {
    grid-template-columns: 1fr;
    gap: 24px;
  }
  .pricing-grid {
    grid-template-columns: 1fr;
  }
  .footer-top {
    grid-template-columns: 1fr;
    gap: 24px;
  }
  .form-row {
    grid-template-columns: 1fr;
  }

  /* ── Grilles du dashboard / espace pro ── */
  .kpi-grid {
    grid-template-columns: repeat(2, 1fr);
  }
  .product-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .prod-body {
    padding: 12px;
  }
  .prod-name {
    font-size: 0.92rem;
  }
  .prod-price {
    font-size: 0.98rem;
  }
  .prod-stock {
    font-size: 0.75rem;
  }
  .prod-actions {
    gap: 6px;
  }
  .prod-actions .btn {
    flex: 1;
    font-size: 0.78rem;
    padding: 8px 10px;
  }
  .voip-provider-grid {
    grid-template-columns: 1fr;
  }
  .cal-grid {
    gap: 2px;
  }

  /* ── Conteneurs larges qui peuvent provoquer un débordement ── */
  .header-inner,
  .hero,
  .pricing-grid,
  .footer-top,
  .kpi-grid,
  .product-grid {
    max-width: 100%;
  }

  /* ── Empêche les images/medias de dépasser le viewport ── */
  img, svg, video, canvas {
    max-width: 100%;
  }
}

/* ─────────────────────────────────────────────────────────────────────────
   PARTIE 10/12 — Styles additifs : gating IA / Agenda / SMS (plan Basique)
   ───────────────────────────────────────────────────────────────────────── */

/* ─────────────────────────────────────────────────────────────────────────
   VERROU GLOBAL CLIENT (Document 2/8) — Fondations CSS
   Classe de verrouillage complet, distincte de .p10-locked (qui reste
   strictement réservée au gating par plan d'Agenda / Assistant IA, Partie 10).
   Appliquée par kazapP13_applyFullLockState (Partie 13, logique JavaScript)

   ───────────────────────────────────────────────────────────────────────── */

.tog-wrap.p14-locked input { cursor:not-allowed; }
.p14-locked-summary {
  display:flex; align-items:center; gap:6px; cursor:pointer;
  font-size:0.75rem; color:var(--ink-light); background:var(--bg);
  border:1px dashed var(--border); border-radius:8px; padding:6px 10px; line-height:1.5;
}
.p14-locked-summary:hover { opacity:0.85; }
/* FIN PARTIE 14 styles */

/* ────────────────────────────────────────────────────────────────────────
   M-DARK-01 — Mode sombre du tableau de bord
   Le mode sombre ne s'applique QUE dans le périmètre du tableau de bord
   (dashboard-layout + les panneaux vendeur affichés en dehors de celui-ci :
   fiche produit, suppression de compte, détail photo variante). La landing
   page publique, les modales de connexion/inscription et la boutique
   publique (commande client) restent toujours en clair : aucune régression
   visuelle sur ces écrans.
   Toutes les propriétés ci-dessous ne font que redéfinir des variables CSS
   déjà utilisées partout dans la feuille de style : pas de nouvelle règle
   à dupliquer, tout le reste du fichier en hérite automatiquement.
   ──────────────────────────────────────────────────────────────────────── */
body.dark-mode #dashboard-layout,
body.dark-mode #product-form-overlay,
body.dark-mode #modal-delete-account,
body.dark-mode #modal-pf-gallery-detail {
 --violet: #5B93C7;
 --violet-deep: #3E6E9E;
 --violet-light: #7BAEDB;
 --violet-soft: #1D2A3D;
 --orange: #D9915C;
 --orange-warm: #E3AC7C;
 --orange-deep: #B9662E;
 --cream: #10141C;
 --white: #1A202C;
 --ink: #E7ECF3;
 --ink-mid: #A9B4C4;
 --ink-light: #78859A;
 --border: #2B3648;
 --success: #34D399;
 --dash-bg: #10141C;
 --row-hover: rgba(255,255,255,0.04);
 --shadow: 0 4px 32px rgba(0,0,0,0.45);
 --shadow-lg: 0 12px 48px rgba(0,0,0,0.6);
 color-scheme: dark;
}
/* Le bouton bascule change d'icône (soleil/lune) via JS ; ici on ajuste
   juste sa couleur active pour rester lisible sur fond sombre. */
body.dark-mode .topbar-darkmode-btn { background: var(--violet-soft); color: var(--violet); }
/* Scrollbars sombres dans le périmètre du dashboard (cosmétique, pas de régression). */
body.dark-mode #dashboard-layout,
body.dark-mode #product-form-overlay {
 scrollbar-color: var(--border) transparent;
}
</style>

let currentLang = localStorage.getItem('kazap_lang') || 'fr';

// fonction t() avec fallback FR si la clé est absente de la langue active
// — identique à la version d'index.html.
function t(key) {
 const lang = currentLang || 'fr';
 const val = I18N_DICT[lang] && I18N_DICT[lang][key];
 return (val !== undefined && val !== '') ? val : ((I18N_DICT.fr && I18N_DICT.fr[key]) || key);
}

// Version allégée de renderTranslations() : le loader n'affiche qu'un seul
// texte traduisible (data-i18n="loader.chargement"), donc pas besoin de
// reprendre ici tous les re-rendus dashboard/landing (renderOrders,
// renderProducts, sections, etc.) présents dans la version complète
// d'index.html — ils n'ont aucun élément correspondant sur cet écran.
function renderTranslations() {
 document.querySelectorAll('[data-i18n]').forEach(el => {
 el.textContent = t(el.getAttribute('data-i18n'));
 });
 document.documentElement.lang = currentLang;
}

renderTranslations();
</script>

<script>
// T-FIX-LOADER-SCROLL-LOCK — verrouille le défilement de html/body pendant
// que #app-loader (écran "Chargement de votre espace entrepreneur…") est
// affiché, pour empêcher la landing page réelle en dessous (déjà présente
// et scrollable dans le DOM à ce stade) de défiler et d'apparaître
// brièvement sous le loader plein écran.
// Volontairement indépendant du compteur kazapLockScroll/kazapUnlockScroll
// utilisé ailleurs pour les fenêtres de la boutique publique (fiche
// produit, panier, contact vendeur…) : #app-loader est toujours le tout
// premier élément affiché au chargement de la page, avant qu'aucun de ces
// overlays ne puisse être ouvert, donc aucun risque d'interférence entre
// les deux mécanismes. Ce <script> est placé juste après le balisage du
// loader et s'exécute de façon synchrone pendant le parsing, donc avant
// que l'utilisateur n'ait la moindre chance de faire un geste de scroll.
(function () {
 try {
 document.documentElement.style.overflow = 'hidden';
 document.body.style.overflow = 'hidden';
 } catch (e) {}
})();
// Déverrouille : appelée depuis les 3 points existants qui masquent
// #app-loader (auth réussie/échouée, filet de sécurité 4s, clic
// "Commencer" sur l'écran de bienvenue client). Idempotente.
window._kazapUnlockLoaderScroll = function () {
 try {
 document.documentElement.style.overflow = '';
 document.body.style.overflow = '';
 } catch (e) {}
};
</script>
